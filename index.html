<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Pong Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene">
    <div id="pong3d">
      <div class="court"></div>
      <div class="nets"></div>
      <div class="score"><span id="score-left">0</span> <span>:</span> <span id="score-right">0</span></div>
      <div class="paddle left" id="paddle-left"></div>
      <div class="paddle right" id="paddle-right"></div>
      <div class="ball" id="ball"></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
